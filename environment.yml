name: dockpipe
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  - pandas # merge_results.py; without it the last stage dies after docking
  # Transitive deps of the pip packages below that pip does not reliably pull
  # in: gemmi for meeko's PDB/mmCIF reading, joblib for molscrub.
  - gemmi
  - joblib
  - pyyaml
  - rdkit=2024.03.5
  - openmm
  - pdbfixer
  - pip
  - pip:
    - meeko>=0.6.0
    - molscrub
    - vina>=1.2.5
    - spyrmsd

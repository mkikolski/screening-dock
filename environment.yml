name: dockpipe
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  - pandas # merge_results.py; without it the last stage dies after docking
  - gemmi # meeko imports it for PDB/mmCIF reading; pip does not always pull it
  - pyyaml
  - rdkit=2024.03.5
  - openmm
  - pdbfixer
  - pip
  - pip:
    - meeko>=0.6.0
    - molscrub
    - vina>=1.2.5
    - spyrmsd

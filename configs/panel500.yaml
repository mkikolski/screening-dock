run_name: panel500_v1
# Tracked in the repo, so it travels with the code and is covered by the commit
# hash in every manifest. Must stay in sync with $PROJECT in run_all.slurm;
# preflight.py fails if it is not there.
ligands_smi: /storage/users/kikolski/screening-dock/exp_c5_selected_500.smi
# Created automatically on the first run (every mkdir uses parents=True), so it
# needs no setup -- only a writable parent. Gitignored: poses and CSVs are large
# and are outputs, not inputs.
output_root: /storage/users/kikolski/screening-dock/results

ligand_ph: 7.4
skip_tautomers: true
n_scrub_attempts: 5
n_workers: 12

vina:
  scoring: vina
  exhaustiveness: 32
  n_poses: 9
  seed: 2137
  cpu: 1
  min_rmsd: 1.0

receptors:
  # ---------------------------------------------------------------- GyrB ---
  - name: gyrb_saureus_3u2d
    pdb_id: 3U2D
    keep_chains: [A]
    keep_hetatms: [] # chain A also has 2 MG; not in the pyrrolamide site
    redock_ligand_resname: 08B
    ph: 7.4
    notes: >
      S. aureus GyrB ATP site. Ligand 08B is the pyrrolamide
      (4-bromo-5-methyl-N-[1-(3-nitropyridin-2-yl)piperidin-4-yl]-1H-pyrrole-2-
      carboxamide), 25 atoms in chain A. Key contact is the Asp/conserved-water
      hinge: if a bridging water sits in the pocket, add HOH to keep_hetatms.
      Entry is a dimer (chains A, B) -- chain A only.
    box:
      reference_ligand_resname: 08B
      size: [22.0, 22.0, 22.0]

  - name: gyrb_ecoli_4zvi
    pdb_id: 4ZVI
    keep_chains: [A]
    keep_hetatms: [] # IOD is a phasing iodide, deliberately dropped
    # Redock: top pose 9.89 A, native pose 1.86 A at rank 4. The site is
    # reproduced; Vina's ranking is what fails. Not a missing water --
    # only one 3.33 A HOH contact exists, and 3U2D passes at 0.52 A with
    # its four 2.72 A waters excluded.
    redock_ligand_resname: 4S4
    ph: 7.4
    notes: >
      E. coli GyrB with the N-phenylpyrrolamide 4S4
      (N-(4-{[(4,5-dibromo-1H-pyrrol-2-yl)carbonyl]amino}benzoyl)glycine),
      23 atoms. Single chain A.
    box:
      reference_ligand_resname: 4S4
      size: [22.0, 22.0, 22.0]

  # ---------------------------------------------------------------- DHFR ---
  - name: dhfr_ecoli_7mym
    pdb_id: 7MYM
    keep_chains: [A]
    keep_hetatms: [NAP] # NADP+ -- REQUIRED, TMP binding is cooperative
    redock_ligand_resname: TOP # verified: TOP = trimethoprim, 21 atoms
    ph: 7.4
    notes: >
      E. coli DHFR ternary complex with trimethoprim and the cofactor. This
      entry holds NAP (NADP+, oxidized), not NDP -- do not "correct" it to NDP
      or split_pdb drops the cofactor silently and the M20 loop pocket is
      destroyed. Chains A, B, C present; chain A only. Chain A also has a free
      ARG and SO4, both ignored.
    box:
      reference_ligand_resname: TOP
      size: [20.0, 20.0, 20.0]

  - name: dhfr_human_2w3a # SELECTIVITY COUNTER-SCREEN
    pdb_id: 2W3A
    keep_chains: [A]
    keep_hetatms: [NDP] # verified NDP here -- this entry really is NADPH
    redock_ligand_resname: TOP
    ph: 7.4
    notes: >
      Human DHFR with TMP + NADPH. Unlike 7MYM and 3GR6 this entry genuinely
      contains NDP (reduced), so the three keep_hetatms lists differ on purpose.
      Dock the same panel here and report the bacterial-minus-human score
      differential as a selectivity axis. Chains A, B; chain A only.
    box:
      reference_ligand_resname: TOP
      size: [20.0, 20.0, 20.0]

  # ---------------------------------------------------------------- FabI ---
  - name: fabi_saureus_3gr6
    pdb_id: 3GR6
    keep_chains: [A]
    keep_hetatms: [NAP] # NADP+ -- part of the binding surface, verified NAP
    # Redock: top pose 5.90 A, native pose 1.70 A at rank 2. Triclosan
    # stacks face-to-face on the NAD+ nicotinamide and Vina under-rewards
    # pi-stacking. No water is involved (closest HOH is 7.07 A), so there
    # is no configuration fix -- treat this receptor's absolute scores as
    # weaker evidence than the three that pass.
    redock_ligand_resname: TCL # verified: TCL = triclosan, 17 atoms
    ph: 7.4
    notes: >
      S. aureus FabI with NADP+ and triclosan. Cofactor is retained because
      triclosan stacks on the nicotinamide ring. Substrate-binding loop is
      ordered only in the ternary complex, so use this holo form. Entry is a
      tetramer (chains A, D, G, J); chain A only.
    box:
      reference_ligand_resname: TCL
      size: [22.0, 22.0, 22.0]
